[workspace]
name = "weftspun-keypoint"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12"

[feature.gate.dependencies]
prek = "*"
ripgrep = "*"
pyyaml = "*"
clang-format = "==22.1.5"
codespell = "==2.4.2"

[feature.build.dependencies]
scons = "==4.11.1"
clangxx = "==22.1.5"
ninja = "*"
cmake = ">=3.28"

[environments]
gate = ["gate"]
build = ["build"]
